[project]
name = "omsdmag"
version = "1.0.0"
description = "Optimización Multiobjetivo de Sistemas Difusos Mamdani mediante Algoritmos Genéticos (Parcial 2 - Computación Flexible)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "scikit-fuzzy>=0.5.0",
    "networkx>=3.0",
    "pygad>=3.1",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "python-docx>=1.1",
]

# ─── Grupos de dependencias OPCIONALES (no se instalan con `uv sync` básico) ───
#   uv sync --group cuda     → PyTorch con CUDA 12.8+ (RTX 5060 / sm_120)
#   uv sync --group notebook → Jupyter para ejecutar la libreta (Run All)
#   uv sync --all-groups     → ambos
[dependency-groups]
cuda = ["torch>=2.7"]                       # opcional — rueda Linux de PyPI con CUDA integrada (cu13 stack, soporta RTX 5060 / sm_120)
notebook = ["jupyter>=1.1", "ipykernel>=6.0"]  # opcional — para ejecutar la libreta (Run All)
